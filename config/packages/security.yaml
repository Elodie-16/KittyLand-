security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User # Vérifie bien si ton entité s'appelle User ou Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            
            logout:
                path: /logout
                target: home
            custom_authenticator: App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true
            # --------------------------

    access_control:
        # Seul un ADMIN peut accéder au CRUD Produit
# - { path: ^/produit, roles: ROLE_ADMIN }  # Supprimé pour accès public
        # Seul un utilisateur connecté peut voir son profil (si tu en as un)
        - { path: ^/profil, roles: ROLE_USER }